[project]
name = "ppk2-lib"
dynamic = ["version", "readme"]
description = "Python library + CLI for Nordic's Power Profiler Kit II (PPK2)"
authors = [{ name = "Roudy Dagher" }]
license = "Apache-2.0 OR MIT"
license-files = ["LICENSE-*"]
requires-python = ">=3.11"
keywords = ["ppk2", "nordic", "power-profiler", "embedded", "current-measurement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "pyserial>=3.5",
    "typer>=0.12",
]

[project.scripts]
ppk2 = "ppk2.cli.main:main"

[project.urls]
Homepage = "https://github.com/rdagher/ppk2-lib"
Documentation = "https://rdagher.github.io/ppk2-lib/"
Repository = "https://github.com/rdagher/ppk2-lib"
Issues = "https://github.com/rdagher/ppk2-lib/issues"

[dependency-groups]
# The A/B capture-comparison harness (validation/): not needed for
# the library, the CLI, or the fast test tier. matplotlib draws the
# plots of the evidence; uv.lock fixes its version, so they come out
# the same on every machine.
validation = [
    "matplotlib>=3.9",
    "pandas>=2",
    "scipy>=1.11",
]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "ruff>=0.7",
]
# The documentation site (zensical.toml, built with Zensical).
docs = [
    "zensical>=0.1.3",
    "mkdocstrings-python>=1.16",
]

[tool.hatch.version]
path = "src/ppk2/__init__.py"

# PyPI shows the README but does not resolve its relative links. In
# the package metadata they point to GitHub at the tag of the version,
# so the page of a release keeps the pictures and pages of that release.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/img/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/rdagher/ppk2-lib/v$HFPR_VERSION/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/rdagher/ppk2-lib/blob/v$HFPR_VERSION/\1)'

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppk2"]

[tool.hatch.build.targets.sdist]
# The source and the tests that run from it alone. tests/test_docs.py
# checks the documentation of the repository, which is not shipped.
include = ["/src", "/tests", "/CHANGELOG.md"]
exclude = ["/tests/test_docs.py"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
markers = [
    "hardware: requires a real PPK2 plugged in (slow, HIL tier)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
# A text file opened without an encoding reads differently on Windows.
# CI sets PYTHONWARNDEFAULTENCODING, which makes Python warn about it.
filterwarnings = ["error::EncodingWarning"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src", "tests"]
exclude = ["**/__pycache__", "**/.*", "tests/hil/bench-dut"]  # a Zephyr app and its build tree
pythonVersion = "3.11"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "error"
reportImplicitOverride = "error"
reportUnnecessaryTypeIgnoreComment = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "warning"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "TCH",  # type-checking imports
    "D",    # pydocstyle
    "SIM",  # simplifications
    "PTH",  # pathlib usage
]
ignore = [
    "D100",  # module-level docstring not required everywhere
    "D104",  # __init__.py docstring not required
    "D105",  # dunder methods rarely need one
    "D107",  # __init__: the class docstring covers it
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]
# Domain-specific Unicode that's intentional and unambiguous in context:
# µ (micro) in µA / µJ / µC, -> (state-machine flow), σ (statistics).
# RUF002/RUF003 still catch genuine ASCII-vs-Unicode confusables.
allowed-confusables = ["µ", "σ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # tests don't need pydocstyle

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = true


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ppk2", "tests"]

[tool.ruff.format]
docstring-code-format = true
