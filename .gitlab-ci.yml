# Canonical CI pipeline. The GitHub Actions workflow mirrors the
# fast tier only; this file carries the full shape: fast tier,
# per-board firmware build matrix, and the HIL tier that consumes
# those firmware artifacts on self-hosted bench runners.

stages: [lint, test, build, firmware, hil]

variables:
  UV_LINK_MODE: copy
  # uv installs strictly from the committed uv.lock; drift fails the job.
  UV_LOCKED: "1"

.uv:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - uv sync --all-extras

lint:
  extends: .uv
  stage: lint
  script:
    - uv run pyright src tests
    - uv run ruff check src tests validation
    - uv run ruff format --check src tests validation

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python$PY-bookworm-slim
  parallel:
    matrix:
      - PY: ["3.11", "3.13"]
  script:
    - uv sync --all-extras
    - uv run pytest -m "not hardware"

wheel:
  extends: .uv
  stage: build
  before_script: []
  script:
    - uv build
  artifacts:
    paths: [dist/]
    expire_in: 2 weeks

# One job per (app x board); each hex feeds the HIL job for that board.
# Mirrors the local flow: nrfutil sdk-manager owns the NCS install
# (default ~/ncs) and launches west.
# Runs in the prebaked NCS toolchain image (docker/Dockerfile).
# NOTE: pulls ghcr.io/rdagher/ppk2-lib-ncs:v3.3.1 — if the tag is
# missing (first setup or NCS bump), build + push it first.
# Note: pulling a private ghcr image from GitLab needs
# DOCKER_AUTH_CONFIG configured on the project.
firmware:
  stage: firmware
  image: ghcr.io/rdagher/ppk2-lib-ncs:v3.3.1
  rules:
    - changes:
        paths: [firmware/**/*, docker/**/*, .gitlab-ci.yml]
  parallel:
    matrix:
      - BOARD:
          - nrf52840dk/nrf52840
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp
  script:
    - DK=$(echo "$BOARD" | cut -d/ -f1)
    - mkdir -p "$CI_PROJECT_DIR/hex"
    - |
      cd /root/ncs/v3.3.1
      for APP in bench-dut trace-demo; do
        nrfutil sdk-manager toolchain launch --ncs-version v3.3.1 -- \
          west build --board "$BOARD" --pristine=always \
            --build-dir "$CI_PROJECT_DIR/build/$APP" "$CI_PROJECT_DIR/firmware/$APP"
        cp "$CI_PROJECT_DIR/build/$APP/merged.hex" "$CI_PROJECT_DIR/hex/$APP-$DK.hex"
      done
  artifacts:
    paths: [hex/]
    expire_in: 2 weeks

