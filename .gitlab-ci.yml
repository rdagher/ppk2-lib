# Future GitLab deployment of the pipeline (the active CI is GitHub
# Actions, .github/workflows/). Same shape: fast tier, per-board
# firmware matrix on a cached NCS toolchain env, HIL tier on
# self-hosted bench runners.

stages: [lint, test, build, prepare, firmware, hil]

variables:
  UV_LINK_MODE: copy
  # uv installs strictly from the committed uv.lock; drift fails the job.
  UV_LOCKED: "1"
  # Single source for the toolchain version: cache key, install, and
  # build paths all derive from it.
  NCS_VERSION: "v3.3.1"

.uv:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - uv sync --all-extras

lint:
  extends: .uv
  stage: lint
  script:
    - uv run pyright src tests
    - uv run ruff check src tests validation
    - uv run ruff format --check src tests validation

test:
  stage: test
  image: ghcr.io/astral-sh/uv:python$PY-bookworm-slim
  parallel:
    matrix:
      - PY: ["3.11", "3.13"]
  script:
    - uv sync --all-extras
    - uv run pytest -m "not hardware"

wheel:
  extends: .uv
  stage: build
  before_script: []
  script:
    - uv build
  artifacts:
    paths: [dist/]
    expire_in: 2 weeks

# Seed the NCS cache once per cold key so the board matrix doesn't
# stampede three parallel ~9 GB installs. The env lives in the
# GitLab cache — caches only hold paths inside the project dir,
# hence .ncs/ + .nrfutil/ (NRFUTIL_HOME + the sdk-manager
# install-dir config). The ~9 GB env needs a runner cache limit to
# match. Guard is the install's terminal artifact, so a partial
# install re-installs instead of wedging the key.
prepare-ncs:
  stage: prepare
  image: ubuntu:24.04
  rules:
    - changes:
        paths: [firmware/**/*, .gitlab-ci.yml]
  cache:
    key: ncs-$NCS_VERSION-toolchain
    paths: [.ncs/, .nrfutil/]
    policy: pull-push
  variables:
    NRFUTIL_HOME: $CI_PROJECT_DIR/.nrfutil
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - export PATH="$CI_PROJECT_DIR/.nrfutil/bin:$PATH"
    - |
      if [ ! -d ".ncs/$NCS_VERSION/zephyr" ]; then
        mkdir -p .nrfutil/bin
        curl -fsSL -o .nrfutil/bin/nrfutil \
          https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
        chmod +x .nrfutil/bin/nrfutil
        nrfutil install sdk-manager
        nrfutil sdk-manager config install-dir set "$CI_PROJECT_DIR/.ncs"
        nrfutil sdk-manager install "$NCS_VERSION"
        rm -rf .ncs/downloads .ncs/tmp
      fi

# One job per board, both apps; the hexes feed the HIL jobs.
# pull-only cache: the env was frozen by prepare-ncs; nothing is
# installed or re-uploaded here.
firmware:
  stage: firmware
  image: ubuntu:24.04
  rules:
    - changes:
        paths: [firmware/**/*, .gitlab-ci.yml]
  cache:
    key: ncs-$NCS_VERSION-toolchain
    paths: [.ncs/, .nrfutil/]
    policy: pull
  variables:
    NRFUTIL_HOME: $CI_PROJECT_DIR/.nrfutil
  parallel:
    matrix:
      - BOARD:
          - nrf52840dk/nrf52840
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp
  before_script:
    - export PATH="$CI_PROJECT_DIR/.nrfutil/bin:$PATH"
  script:
    - DK=$(echo "$BOARD" | cut -d/ -f1)
    - mkdir -p "$CI_PROJECT_DIR/hex"
    - |
      cd "$CI_PROJECT_DIR/.ncs/$NCS_VERSION"
      for APP in bench-dut; do
        nrfutil sdk-manager toolchain launch --ncs-version "$NCS_VERSION" -- \
          west build --board "$BOARD" --pristine=always \
            --build-dir "$CI_PROJECT_DIR/build/$APP" "$CI_PROJECT_DIR/firmware/$APP"
        cp "$CI_PROJECT_DIR/build/$APP/merged.hex" "$CI_PROJECT_DIR/hex/$APP-$DK.hex"
      done
  artifacts:
    paths: [hex/]
    expire_in: 2 weeks

# ── HIL tier (placeholders) ─────────────────────────────────────
