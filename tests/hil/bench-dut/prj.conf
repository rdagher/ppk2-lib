# nRF54LM20 PPK2 bench DUT: minimal Zephyr config.
#
# GPIO output for two of the PPK2's digital inputs; everything else is
# pruned so the binary is small and the current trace is dominated
# by the toggle activity itself rather than incidental subsystems.

CONFIG_GPIO=y

# Logging / console: off. We don't want UART traffic competing for
# CPU time while the timers fire, and there's nothing for a human
# to read.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# Power management: leave defaults. Zephyr's PM idles the CPU
# between timer events, which is what we want for a clean trace.
