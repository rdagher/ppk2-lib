# Documentation site. Built with Zensical, which reads this file as is:
#   just docs          (into site/)
#   just docs-serve    (preview on localhost:8000)
# docs/contributing/doc-patterns.md says what goes where.
site_name: ppk2-lib
site_description: A Python library and command-line tool for Nordic's Power Profiler Kit II
site_url: https://rdagher.github.io/ppk2-lib/
repo_url: https://github.com/rdagher/ppk2-lib
repo_name: rdagher/ppk2-lib

nav:
  - Introduction: index.md
  - Using it:
      - Getting started: use/getting-started.md
      - The ppk2 command: use/command.md
      - Recipes: use/recipes.md
      - Architecture: use/architecture.md
      - API reference: use/api.md
      - Troubleshooting: use/troubleshooting.md
  - How it measures:
      - Measurement principle: measure/principle.md
      - Protocol: measure/protocol.md
      - File formats: measure/formats.md
  - Validation against Nordic's app:
      - Method: validation/method.md
      - Results: validation/results.md
  - Contributing:
      - Doc patterns: contributing/doc-patterns.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            heading_level: 3
            members_order: source
            filters: ["!^_"]
