# Documentation site, built with Zensical:
#   just docs          (into site/)
#   just docs-serve    (preview on localhost:8000)
# CONTRIBUTING.md says what goes where.

[project]
site_name = "ppk2-lib"
site_description = "A Python library and command-line tool for Nordic's Power Profiler Kit II"
site_url = "https://rdagher.github.io/ppk2-lib/"
repo_url = "https://github.com/rdagher/ppk2-lib"
repo_name = "rdagher/ppk2-lib"
nav = [
  { "Introduction" = "index.md" },
  { "User guide" = [
    { "Getting started" = "user/getting-started.md" },
    { "The ppk2 command" = "user/command.md" },
    { "Recipes" = "user/recipes.md" },
    { "Troubleshooting" = "user/troubleshooting.md" },
  ] },
  { "Developer guide" = [
    { "Architecture" = "develop/architecture.md" },
    { "API reference" = "develop/api.md" },
  ] },
  { "Measurements" = [
    { "Principle" = "measure/principle.md" },
    { "Protocol" = "measure/protocol.md" },
    { "File formats" = "measure/formats.md" },
  ] },
  { "Validation against Nordic's app" = [
    { "Method" = "validation/method.md" },
    { "Results" = "validation/results.md" },
  ] },
]

[project.theme]
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
separate_signature = true
show_symbol_type_heading = true
show_symbol_type_toc = true
heading_level = 3
members_order = "source"
filters = ["!^_"]
