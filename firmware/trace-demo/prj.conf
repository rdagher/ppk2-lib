# PPK2 trace-marker demo — minimal Zephyr config.
#
# GPIO for the two trace markers + the LED; C++17 for the RAII scope
# guard. Console/serial/logging are off so nothing but the workload
# shapes the current trace.

CONFIG_GPIO=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y

CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
