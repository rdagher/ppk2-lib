# The active CI: fast tier (pyright/ruff, tests, wheel), toolchain
# image rebuild, per-board firmware matrix, commented HIL
# placeholders. .gitlab-ci.yml carries the same shape for a future
# GitLab deployment.
name: ci

on:
  push:
    branches: ["**"]   # all branches; tags are the release workflow's job
  pull_request:
  workflow_dispatch:

# A new push cancels the in-flight run of the same ref. push and
# pull_request runs aren't deduped (different refs); if PR-based
# review is ever adopted, restrict push back to [main].
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv command installs strictly from the committed uv.lock and
# fails if pyproject drifted from it — CI never re-resolves.
env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: pyright + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync

      - name: Pyright (strict)
        run: uv run pyright src tests

      - name: Ruff lint
        run: uv run ruff check src tests validation

      - name: Ruff format check
        run: uv run ruff format --check src tests validation

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --all-extras

      - name: Fast test tier
        run: uv run pytest -m "not hardware"

  build:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build

  # Firmware only rebuilds when firmware sources (or this workflow)
  # change — docs/python-only pushes skip the heavy jobs entirely.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firmware:
              - 'firmware/**'
              - 'docker/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'docker/**'
              - '.github/workflows/docker-image.yml'

  # Rebuild + push the toolchain image when its inputs change, so the
  # firmware matrix below always pulls a fresh tag (needs: gives the
  # ordering GitHub can't express across separate workflows).
  image:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml

  # One job per board, both apps, inside the prebaked NCS toolchain
  # image — the image IS the frozen env: no setup steps, no cache
  # (ccache not worth wiring: these apps compile in seconds).
  # `!cancelled()` keeps this running when `image` is skipped
  # (docker unchanged) — a plain `if` would skip with it.
  firmware:
    name: fw ${{ matrix.board }}
    needs: [changes, image]
    if: >-
      !cancelled()
      && needs.changes.outputs.firmware == 'true'
      && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/rdagher/ppk2-lib-ncs:v3.3.1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        board:
          - nrf52840dk/nrf52840
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp
    steps:
      - uses: actions/checkout@v4

      - name: Build both apps
        id: build
        run: |
          DK=$(echo "${{ matrix.board }}" | cut -d/ -f1)
          echo "dk=$DK" >> "$GITHUB_OUTPUT"
          mkdir -p "$GITHUB_WORKSPACE/hex"
          cd /root/ncs/v3.3.1
          for APP in bench-dut trace-demo; do
            nrfutil sdk-manager toolchain launch --ncs-version v3.3.1 -- \
              west build --board "${{ matrix.board }}" --pristine=always \
                --build-dir "$GITHUB_WORKSPACE/build/$APP" \
                "$GITHUB_WORKSPACE/firmware/$APP"
            cp "$GITHUB_WORKSPACE/build/$APP/merged.hex" \
              "$GITHUB_WORKSPACE/hex/$APP-$DK.hex"
          done

      - name: Upload hex bundle (feeds the HIL bench)
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ steps.build.outputs.dk }}
          path: hex/*.hex
          retention-days: 14

  # ── HIL tier (placeholders) ──────────────────────────────────
  # Self-hosted bench runners (planned: two Raspberry Pis), each
  # with a PPK2 wired to one DK. Runner labels select the hardware;
  # the fw-<dk> artifact from the matrix supplies the hexes: flash
  # bench-dut under PPK2 power, then run the hardware-marked tier.
  #
  # hil-nrf52840:
  #   needs: [changes, firmware]
  #   if: needs.changes.outputs.firmware == 'true'
  #   runs-on: [self-hosted, ppk2-bench, nrf52840dk]
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/download-artifact@v4
  #       with: { name: fw-nrf52840dk, path: hex }
  #     - uses: astral-sh/setup-uv@v5
  #     - run: uv sync --all-extras
  #     - run: uv run ppk2 run --source --vdd 3.0 --
  #         nrfutil device program --firmware hex/bench-dut-nrf52840dk.hex
  #     - run: uv run pytest -m hardware
  #
  # hil-nrf54lm20:
  #   needs: [changes, firmware]
  #   if: needs.changes.outputs.firmware == 'true'
  #   runs-on: [self-hosted, ppk2-bench, nrf54lm20dk]
  #   timeout-minutes: 20
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/download-artifact@v4
  #       with: { name: fw-nrf54lm20dk, path: hex }
