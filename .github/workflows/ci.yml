# Fast-tier CI: static analysis + hardware-free tests + wheel build.
#
# Fast tier only. The canonical full pipeline (firmware build matrix
# per board + HIL tier on self-hosted bench runners) is .gitlab-ci.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: pyright + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync

      - name: Pyright (strict)
        run: uv run pyright src tests

      - name: Ruff lint
        run: uv run ruff check src tests validation

      - name: Ruff format check
        run: uv run ruff format --check src tests validation

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --all-extras

      - name: Fast test tier
        run: uv run pytest -m "not hardware"

  build:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
