# Fast-tier CI: static analysis + hardware-free tests + wheel build.
#
# Fast tier + firmware build matrix. The canonical full pipeline
# (including the HIL tier on self-hosted bench runners) is
# .gitlab-ci.yml; the firmware jobs here mirror its matrix so the
# shipped Zephyr apps stay green per board.
name: ci

on:
  push:
    branches: ["**"]   # all branches; tags are the release workflow's job
  pull_request:
  workflow_dispatch:

# A new push cancels the previous in-flight run of the same ref.
# Note: direct-push workflow — with a PR open, push + pull_request
# events would both run (different refs, not deduped). If we adopt
# PR-based review, restrict push back to [main].
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pyright + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync deps
        run: uv sync

      - name: Pyright (strict)
        run: uv run pyright src tests

      - name: Ruff lint
        run: uv run ruff check src tests validation

      - name: Ruff format check
        run: uv run ruff format --check src tests validation

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --all-extras

      - name: Fast test tier
        run: uv run pytest -m "not hardware"

  build:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build

  firmware:
    name: fw ${{ matrix.app }} / ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [bench-dut, trace-demo]
        board:
          - nrf52840dk/nrf52840
          - nrf54l15dk/nrf54l15/cpuapp
          - nrf54lm20dk/nrf54lm20b/cpuapp
    steps:
      - uses: actions/checkout@v4

      # Same toolchain flow as the local justfiles: nrfutil sdk-manager
      # owns the NCS install (default ~/ncs on Linux) and launches west.
      - name: Cache NCS install
        uses: actions/cache@v4
        with:
          path: ~/ncs
          key: ncs-v3.3.1

      - name: Install nrfutil + sdk-manager
        run: |
          curl -fsSL -o /usr/local/bin/nrfutil \
            https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          sudo chmod +x /usr/local/bin/nrfutil
          nrfutil install sdk-manager

      - name: Install NCS v3.3.1 (cache miss only)
        run: |
          if [ ! -d "$HOME/ncs/v3.3.1" ]; then
            nrfutil sdk-manager install v3.3.1
            rm -rf "$HOME/ncs/downloads" "$HOME/ncs/tmp"
          fi

      - name: Build
        id: build
        run: |
          DK=$(echo "${{ matrix.board }}" | cut -d/ -f1)
          echo "dk=$DK" >> "$GITHUB_OUTPUT"
          cd "$HOME/ncs/v3.3.1"
          nrfutil sdk-manager toolchain launch --ncs-version v3.3.1 -- \
            west build --board "${{ matrix.board }}" --pristine=always \
              --build-dir "$GITHUB_WORKSPACE/build/$DK" \
              "$GITHUB_WORKSPACE/firmware/${{ matrix.app }}"
          mkdir -p "$GITHUB_WORKSPACE/hex"
          cp "$GITHUB_WORKSPACE/build/$DK/merged.hex" \
            "$GITHUB_WORKSPACE/hex/${{ matrix.app }}-$DK.hex"

      - name: Upload hex (feeds the HIL bench)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ steps.build.outputs.dk }}
          path: hex/*.hex
          retention-days: 14
