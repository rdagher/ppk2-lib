# Build + push the NCS toolchain image the firmware matrix runs in.
# Called by ci.yml when docker/ changes (so firmware jobs wait for
# the fresh image), or triggered manually for first setup / an NCS
# bump. Local mirror: docker/justfile (build / push).
name: docker-image

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry layer cache: rebuilds pull unchanged layers (apt,
      # nrfutil, toolchain, west workspace) from the existing tag and
      # re-run only what the Dockerfile edit touched.
      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64
          push: true
          tags: ghcr.io/rdagher/ppk2-lib-ncs:v3.3.1
          cache-from: type=registry,ref=ghcr.io/rdagher/ppk2-lib-ncs:v3.3.1
          cache-to: type=inline
